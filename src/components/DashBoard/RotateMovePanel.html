<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可旋转仪表盘预览</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Inter 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* 确保Inter字体可用 */
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="app"></div>

    <script type="module">
        const { createApp, ref, onMounted, onBeforeUnmount, computed } = Vue;

        // 定义 RotatableDial 组件
        const RotatableDial = {
            name: 'RotatableDial',
            template: `
                <div class="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-white p-4 font-inter">
                    <h1 class="text-3xl font-bold mb-8">旋转仪表盘</h1>

                    <div class="relative flex flex-col sm:flex-row items-center justify-center mb-8">
                        <!-- 左侧控制按钮 -->
                        <button
                            @click="rotateDial(-15)"
                            class="p-4 bg-gray-700 rounded-full shadow-lg hover:bg-gray-600 transition-colors duration-200 mb-4 sm:mb-0 sm:mr-4"
                            aria-label="向左旋转"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>

                        <!-- 仪表盘容器 -->
                        <div
                            class="relative w-80 h-80 rounded-full bg-gray-800 shadow-xl flex items-center justify-center select-none overflow-hidden"
                            @mousedown="startDrag"
                            @mousemove="doDrag"
                            @mouseup="endDrag"
                            @mouseleave="endDrag"
                            :style="{ cursor: isDragging ? 'grabbing' : 'grab' }"
                        >
                            <!-- 指针 (从中心指向北方，短一点，细一点) -->
                            <div class="absolute w-1 h-24 bg-red-500 z-30" style="top: calc(50% - 96px); left: 50%; transform: translateX(-50%);"></div>
                            <!-- 指针底部的红色小圆点，位于中心 -->
                            <div class="absolute w-4 h-4 bg-red-500 rounded-full z-30" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>

                            <!-- 中心显示度数 (不旋转) -->
                            <div class="absolute text-3xl font-bold text-white z-20 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                                {{ currentDegree.toFixed(0) }}°
                            </div>

                            <!-- 内部可旋转仪表盘 -->
                            <div
                                ref="innerDial"
                                class="absolute w-72 h-72 rounded-full bg-gray-700 flex items-center justify-center transition-transform duration-100 ease-linear"
                                :style="{ transform: \`rotate(\${rotationAngle}deg)\` }"
                            >
                                <!-- 角度刻度 -->
                                <div
                                    v-for="(degree, index) in degreeMarkings"
                                    :key="index"
                                    class="absolute text-sm font-semibold text-gray-300"
                                    :style="getDegreeMarkingStyle(degree.angle)"
                                >
                                    {{ degree.label }}°
                                </div>

                                <!-- 内部图标 (保持不变，但位置可能需要调整以适应新的刻度布局) -->
                                <div class="absolute" :style="getIconStyle(0)">
                                    <span class="text-green-400 text-xl">✨</span> <!-- 闪光 -->
                                </div>
                                <div class="absolute" :style="getIconStyle(1)">
                                    <span class="text-orange-400 text-xl">☀️</span> <!-- 太阳 -->
                                </div>
                            </div>

                            <!-- 外部静态元素 -->
                            <!-- 睡眠图标 -->
                            <div class="absolute top-4 right-4 text-gray-400 text-3xl z-10">
                                💤
                            </div>
                            <!-- 铃铛图标 -->
                            <div class="absolute bottom-4 right-4 text-gray-400 text-3xl z-10">
                                🔔
                            </div>

                            <!-- 右侧进度条状元素 -->
                            <div
                                class="absolute right-0 top-1/2 -translate-y-1/2 w-6 h-48 bg-gray-600 rounded-full flex flex-col justify-around items-center p-1 z-10"
                                style="transform: translateX(30%);"
                            >
                                <div v-for="i in 8" :key="i" class="w-1 h-4 bg-gray-500 rounded-full"></div>
                            </div>
                        </div>

                        <!-- 右侧控制按钮 -->
                        <button
                            @click="rotateDial(15)"
                            class="p-4 bg-gray-700 rounded-full shadow-lg hover:bg-gray-600 transition-colors duration-200 mt-4 sm:mt-0 sm:ml-4"
                            aria-label="向右旋转"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <!-- 上下控制按钮 -->
                    <div class="flex flex-col items-center mt-4">
                        <button
                            @click="rotateDial(15)"
                            class="p-4 bg-gray-700 rounded-full shadow-lg hover:bg-gray-600 transition-colors duration-200 mb-4"
                            aria-label="向上旋转"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                        </button>
                        <button
                            @click="rotateDial(-15)"
                            class="p-4 bg-gray-700 rounded-full shadow-lg hover:bg-gray-600 transition-colors duration-200"
                            aria-label="向下旋转"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2d000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>
                </div>
            `,
            setup() {
                const rotationAngle = ref(0);
                const isDragging = ref(false);
                const startX = ref(0);
                const startY = ref(0);
                const startRotationAngle = ref(0);
                const dialCenterX = ref(0);
                const dialCenterY = ref(0);
                const innerDial = ref(null); // 内部仪表盘元素的引用

                // 生成0-360度的刻度
                const degreeMarkings = computed(() => {
                    const markings = [];
                    // 每30度一个刻度，从0度开始
                    for (let i = 0; i < 360; i += 30) {
                        markings.push({ label: i.toString(), angle: i });
                    }
                    return markings;
                });

                // 计算当前度数，确保在0-359之间
                // 指针固定在上方（北），仪表盘旋转。
                // 当仪表盘顺时针旋转时，其刻度相对于指针逆时针移动。
                // 例如，仪表盘旋转30度，原先在0度的刻度移到30度位置，
                // 此时指针指向的是仪表盘上的330度刻度。
                const currentDegree = computed(() => {
                    let degree = (360 - (rotationAngle.value % 360) + 360) % 360;
                    return degree;
                });

                const iconPositions = [
                    { angle: 45, radius: 80 }, // 闪光图标
                    { angle: 225, radius: 80 }, // 太阳图标
                ];

                const updateDialCenter = () => {
                    if (innerDial.value) {
                        const rect = innerDial.value.getBoundingClientRect();
                        dialCenterX.value = rect.left + rect.width / 2;
                        dialCenterY.value = rect.top + rect.height / 2;
                    }
                };

                const startDrag = (event) => {
                    isDragging.value = true;
                    startX.value = event.clientX;
                    startY.value = event.clientY;
                    startRotationAngle.value = rotationAngle.value;
                    event.preventDefault();
                };

                const doDrag = (event) => {
                    if (!isDragging.value) return;

                    const startVecX = startX.value - dialCenterX.value;
                    const startVecY = startY.value - dialCenterY.value;

                    const currentVecX = event.clientX - dialCenterX.value;
                    const currentVecY = event.clientY - dialCenterY.value;

                    const startAngleRad = Math.atan2(startVecY, startVecX);
                    const currentAngleRad = Math.atan2(currentVecY, currentVecX);

                    const angleDiffDeg = (currentAngleRad - startAngleRad) * (180 / Math.PI);

                    rotationAngle.value = startRotationAngle.value + angleDiffDeg;
                };

                const endDrag = () => {
                    isDragging.value = false;
                };

                const rotateDial = (angle) => {
                    rotationAngle.value += angle;
                };

                // 计算每个角度刻度在仪表盘上的CSS定位样式
                const getDegreeMarkingStyle = (angle) => {
                    const radius = 120; // 刻度距离仪表盘中心的距离

                    // 根据角度和半径计算刻度的X, Y坐标
                    // 这里的角度计算是基于0度在顶部，顺时针增加
                    const x = radius * Math.sin(angle * Math.PI / 180);
                    const y = -radius * Math.cos(angle * Math.PI / 180);

                    return {
                        left: `calc(50% + ${x}px)`, // X坐标
                        top: `calc(50% + ${y}px)`,   // Y坐标
                        // 反向旋转，使文字始终保持正向
                        transform: `translate(-50%, -50%) rotate(${-rotationAngle.value}deg)`,
                        position: 'absolute',
                    };
                };

                // 计算内部图标在仪表盘上的CSS定位样式
                const getIconStyle = (index) => {
                    const angle = iconPositions[index].angle; // 获取图标的初始角度
                    const radius = iconPositions[index].radius; // 获取图标距离中心点的半径

                    // 根据角度和半径计算图标的X, Y坐标
                    const x = radius * Math.sin(angle * Math.PI / 180);
                    const y = -radius * Math.cos(angle * Math.PI / 180);

                    return {
                        left: `calc(50% + ${x}px)`, // X坐标
                        top: `calc(50% + ${y}px)`,   // Y坐标
                        // 反向旋转，使图标始终保持正向
                        transform: `translate(-50%, -50%) rotate(${-rotationAngle.value}deg)`,
                        position: 'absolute',
                    };
                };

                onMounted(() => {
                    updateDialCenter();
                    window.addEventListener('resize', updateDialCenter);
                });

                onBeforeUnmount(() => {
                    window.removeEventListener('resize', updateDialCenter);
                });

                return {
                    rotationAngle,
                    isDragging,
                    startX,
                    startY,
                    startRotationAngle,
                    dialCenterX,
                    dialCenterY,
                    degreeMarkings,
                    currentDegree,
                    iconPositions,
                    innerDial, // 暴露 ref
                    startDrag,
                    doDrag,
                    endDrag,
                    rotateDial,
                    getDegreeMarkingStyle,
                    getIconStyle,
                };
            },
        };

        // 创建Vue应用并挂载
        createApp(RotatableDial).mount('#app');
    </script>
</body>
</html>
